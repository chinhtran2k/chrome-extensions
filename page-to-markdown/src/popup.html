<!doctype html>
<meta charset="utf-8">
<title>Page to Markdown</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#6b7280;
          --line:#e5e7eb; --accent:#2563eb; --ok:#059669; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#9ca3af; --line:#38383a; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg);
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  button { width: 100%; padding: 9px 12px; margin-bottom: 8px; border: 0; border-radius: 7px;
           background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
           cursor: pointer; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: default; }
  .opts { margin: 12px 0 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .status { min-height: 18px; font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .stats { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
<h1>Page to Markdown</h1>

<button id="copy">Copy as Markdown</button>
<button id="download" class="secondary">Download .md file</button>

<div class="opts">
  <label><input type="checkbox" id="selectionOnly"> Selection only, when text is selected</label>
  <label><input type="checkbox" id="links"> Keep links <span style="color:var(--muted)">— roughly doubles the tokens</span></label>
  <label><input type="checkbox" id="images"> Keep images</label>
  <label><input type="checkbox" id="tables" checked> Keep tables</label>
  <label><input type="checkbox" id="frontMatter"> Add title and source header</label>
</div>

<div class="status" id="status"></div>
<div class="stats" id="stats"></div>

<script src="popup.js"></script>
